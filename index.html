<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Promo Studio - Pro AI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fabric.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    body { background-color: #080c14; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .canvas-container { margin: 0 auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-6 py-3.5 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🎰</span>
      <div>
        <h1 class="text-lg font-bold bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-500 bg-clip-text text-transparent">
          AI Promo Studio
        </h1>
        <p class="text-xs text-slate-400">Professional Casino Content Generator</p>
      </div>
    </div>
    <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Multi-AI Engine
    </span>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <!-- Sidebar Controls -->
    <aside class="w-full lg:w-96 bg-slate-900 border-r border-slate-800 p-5 flex flex-col gap-5 overflow-y-auto max-h-screen">
      
      <!-- 1. AI Image Generator Panel -->
      <div class="bg-slate-950/70 p-4 rounded-xl border border-amber-500/20">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <span>✨</span> ကာစီနို AI ပုံထုတ်လုပ်ရန် (HD Studio)
        </h2>
        
        <!-- Preset Prompts -->
        <div class="flex flex-col gap-1.5 mb-2.5">
          <label class="text-[11px] text-slate-400">ဒီဇိုင်း စတိုင်ရွေးပါ -</label>
          <div class="grid grid-cols-2 gap-1.5">
            <button class="ai-chip text-[11px] bg-slate-800 hover:bg-amber-500/20 hover:text-amber-300 text-slate-300 p-2 rounded-lg border border-slate-700 text-left transition">🎰 ဂျက်ပေါ့ စလော့စက်</button>
            <button class="ai-chip text-[11px] bg-slate-800 hover:bg-amber-500/20 hover:text-amber-300 text-slate-300 p-2 rounded-lg border border-slate-700 text-left transition">🎡 ကာစီနို လှည့်ဘီး</button>
            <button class="ai-chip text-[11px] bg-slate-800 hover:bg-amber-500/20 hover:text-amber-300 text-slate-300 p-2 rounded-lg border border-slate-700 text-left transition">🎁 ရွှေဒင်္ဂါးလက်ဆောင်</button>
            <button class="ai-chip text-[11px] bg-slate-800 hover:bg-amber-500/20 hover:text-amber-300 text-slate-300 p-2 rounded-lg border border-slate-700 text-left transition">🃏 ရှမ်းကိုးမီး/ဖဲချပ်</button>
          </div>
        </div>

        <textarea id="aiPrompt" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-400">3D golden casino slot machine with explosive flying gold coins, vibrant casino neon lights, dark luxury background, octane 3D render, 8k resolution, cinematic lighting</textarea>
        
        <button id="generateAiImgBtn" class="mt-3 w-full bg-gradient-to-r from-amber-500 via-orange-500 to-yellow-500 hover:opacity-95 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition flex justify-center items-center gap-2 shadow-lg shadow-amber-950/40">
          <span id="btnIcon">🪄</span> <span id="btnText">ကာစီနို ပုံအသစ်ထုတ်မည် (AI Generate)</span>
        </button>
      </div>

      <!-- 2. Manual Upload & Cut/Paste -->
      <div>
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">မိမိစိတ်ကြိုက်ပုံထည့်ရန်</h2>
        <label class="block w-full cursor-pointer bg-slate-800/80 hover:bg-slate-800 border border-dashed border-slate-600 hover:border-amber-400/60 rounded-xl p-2.5 text-center transition">
          <span class="text-xs text-amber-400 font-medium">+ ပုံရွေးချယ်တင်ပါ (Upload)</span>
          <input type="file" id="imageLoader" accept="image/*" class="hidden">
        </label>
      </div>

      <!-- 3. Text & Casino Promo Presets -->
      <div>
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">စာတန်းဒီဇိုင်း ထည့်ရန်</h2>
        <div class="flex flex-col gap-2">
          <input type="text" id="textInput" placeholder="စာသားရိုက်ထည့်ပါ..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
          
          <div class="flex flex-wrap gap-1.5">
            <button class="preset-chip text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">သွင်းငွေ 100% ဘောနပ်စ်</button>
            <button class="preset-chip text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">ရှမ်းကိုးမီး / စလော့</button>
            <button class="preset-chip text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">VIP အထူးလက်ဆောင်</button>
          </div>

          <button id="addTextBtn" class="mt-1 w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-semibold py-1.5 rounded-lg text-xs border border-slate-700 transition">
            + စာသားထည့်မည်
          </button>
        </div>
      </div>

      <!-- 4. Burmese TTS -->
      <div class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800">
        <h2 class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <span>🔊</span> မြန်မာအသံ ထည့်သွင်းရန်
        </h2>
        <input type="text" id="ttsInput" value="အခုပဲ အကောင့်ဖွင့်ပြီး ဘောနပ်စ်ရယူလိုက်ပါ" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-sky-400">
        <button id="speakBtn" class="mt-2 w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-1.5 rounded-lg text-xs transition flex justify-center items-center gap-1.5">
          <span>▶️</span> အသံဖွင့်နားထောင်မည်
        </button>
      </div>

      <!-- 5. Actions -->
      <div>
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ပြင်ဆင်ချက်များ</h2>
        <div class="grid grid-cols-2 gap-2">
          <button id="deleteBtn" class="bg-rose-950/30 hover:bg-rose-900/50 text-rose-400 border border-rose-900/50 py-2 rounded-lg text-xs transition">
            ရွေးထားတာဖျက်မည်
          </button>
          <button id="clearBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700 py-2 rounded-lg text-xs transition">
            အားလုံးရှင်းမည်
          </button>
        </div>
      </div>

      <!-- Download Button -->
      <div class="mt-auto pt-2 border-t border-slate-800">
        <button id="downloadBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-950/50 flex justify-center items-center gap-2">
          <span>📥</span> ပရိုမိုးရှင်းပုံ ဒေါင်းလုဒ်ဆွဲမည်
        </button>
      </div>
    </aside>

    <!-- Canvas Workspace -->
    <main class="flex-1 bg-slate-950 p-6 flex items-center justify-center overflow-auto">
      <div class="border border-slate-800 rounded-2xl overflow-hidden bg-slate-900 shadow-2xl">
        <canvas id="promoCanvas" width="600" height="600"></canvas>
      </div>
    </main>
  </div>

  <script>
    const HF_TOKEN = "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";

    const canvas = new fabric.Canvas('promoCanvas', {
      backgroundColor: '#0a0f1d'
    });

    const defaultBg = new fabric.Rect({
      left: 0,
      top: 0,
      width: 600,
      height: 600,
      fill: '#0a0f1d',
      selectable: false
    });
    canvas.add(defaultBg);

    // Prompt Chips ရွေးချယ်မှု
    document.querySelectorAll('.ai-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        const text = this.innerText;
        if(text.includes('စလော့စက်')) {
          document.getElementById('aiPrompt').value = "A dazzling 3D golden casino slot machine, explosive flying gold coins, vibrant casino neon lights, dark luxury background, octane 3D render, 8k resolution, cinematic lighting";
        } else if(text.includes('လှည့်ဘီး')) {
          document.getElementById('aiPrompt').value = "Luxury 3D casino lucky fortune wheel, golden glowing lighting, floating poker chips and gemstones, dark elegant casino atmosphere, 8k render";
        } else if(text.includes('လက်ဆောင်')) {
          document.getElementById('aiPrompt').value = "Exploding luxury red velvet gift box filled with glowing gold coins and sparkling gems, dynamic casino jackpot celebration effect, 3D hyper-detailed render";
        } else if(text.includes('ရှမ်းကိုးမီး')) {
          document.getElementById('aiPrompt').value = "Floating golden playing cards, glowing ace of spades, poker chips and gold coins swirling around, luxury VIP casino table background, dramatic lighting, 8k";
        }
      });
    });

    // Multi-Server AI Loader (HF အဆင်မပြေပါက Backup AI သို့ အလိုအလျောက် ပြောင်းပေးသည့် စနစ်)
    async function fetchAiImage(promptText) {
      // ၁။ Hugging Face Server စမ်းသပ်ခြင်း
      try {
        const res = await fetch("https://router.huggingface.co/hf-inference/models/stabilityai/stable-diffusion-xl-base-1.0", {
          headers: {
            Authorization: `Bearer ${HF_TOKEN}`,
            "Content-Type": "application/json",
          },
          method: "POST",
          body: JSON.stringify({
            inputs: promptText,
            parameters: { negative_prompt: "ugly, blurry, lowres, watermark, text, signature" }
          })
        });

        if (res.ok) {
          const blob = await res.blob();
          return URL.createObjectURL(blob);
        }
      } catch (e) {
        console.warn("HF router direct error, trying fallback...", e);
      }

      // ၂။ အကယ်၍ HF domain ကို သင့် internet/DNS မှ ပိတ်ထားပါက တိုက်ရိုက် ultra-hd casino engine သို့ အလိုအလျောက် ပြောင်းလဲထုတ်ပေးခြင်း
      const seed = Math.floor(Math.random() * 888888);
      const enhancedPrompt = encodeURIComponent(promptText + ", commercial casino advertising poster, ultra detailed, octane 3d render, 8k, photorealistic");
      return `https://image.pollinations.ai/prompt/${enhancedPrompt}?width=600&height=600&seed=${seed}&model=flux-realism&nologo=true`;
    }

    // AI ပုံထုတ် Button
    document.getElementById('generateAiImgBtn').addEventListener('click', async function() {
      const prompt = document.getElementById('aiPrompt').value.trim();
      if (!prompt) return;

      const btn = this;
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      
      btnText.innerText = "AI ဖြင့် ပုံထုတ်နေပါသည် (ခေတ္တစောင့်ပါ)...";
      btnIcon.innerText = "⏳";
      btn.disabled = true;

      try {
        const imageUrl = await fetchAiImage(prompt);
        fabric.Image.fromURL(imageUrl, function(img) {
          if (!img) {
            alert("ပုံဆွဲယူ၍ မရရှိပါ။ ထပ်မံကြိုးစားပေးပါ။");
            btnText.innerText = "ကာစီနို ပုံအသစ်ထုတ်မည် (AI Generate)";
            btnIcon.innerText = "🪄";
            btn.disabled = false;
            return;
          }

          img.scaleToWidth(520);
          img.set({
            left: (600 - img.getScaledWidth()) / 2,
            top: (600 - img.getScaledHeight()) / 2
          });
          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.renderAll();

          btnText.innerText = "ကာစီနို ပုံအသစ်ထုတ်မည် (AI Generate)";
          btnIcon.innerText = "🪄";
          btn.disabled = false;
        }, { crossOrigin: 'anonymous' });
      } catch (err) {
        alert("ချိတ်ဆက်မှု မအောင်မြင်ပါ: " + err.message);
        btnText.innerText = "ကာစီနို ပုံအသစ်ထုတ်မည် (AI Generate)";
        btnIcon.innerText = "🪄";
        btn.disabled = false;
      }
    });

    // Upload Image
    document.getElementById('imageLoader').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (f) {
        fabric.Image.fromURL(f.target.result, function (img) {
          img.scaleToWidth(300);
          canvas.add(img);
          canvas.setActiveObject(img);
        });
      };
      reader.readAsDataURL(file);
    });

    // Add Text
    function addTextToCanvas(content) {
      const text = new fabric.IText(content, {
        left: 120,
        top: 250,
        fontFamily: 'sans-serif',
        fill: '#fbbf24',
        stroke: '#000000',
        strokeWidth: 2,
        fontSize: 34,
        fontWeight: 'bold'
      });
      canvas.add(text);
      canvas.setActiveObject(text);
    }

    document.getElementById('addTextBtn').addEventListener('click', function () {
      const val = document.getElementById('textInput').value.trim() || 'ပရိုမိုးရှင်း အထူးလက်ဆောင်';
      addTextToCanvas(val);
    });

    document.querySelectorAll('.preset-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        document.getElementById('textInput').value = this.innerText;
        addTextToCanvas(this.innerText);
      });
    });

    // Burmese Voice
    document.getElementById('speakBtn').addEventListener('click', function() {
      const text = document.getElementById('ttsInput').value;
      if (!text) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'my-MM';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    });

    // Delete
    document.getElementById('deleteBtn').addEventListener('click', function () {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject !== defaultBg) {
        canvas.remove(activeObject);
      }
    });

    // Clear
    document.getElementById('clearBtn').addEventListener('click', function () {
      canvas.clear();
      canvas.add(defaultBg);
      canvas.renderAll();
    });

    // Download
    document.getElementById('downloadBtn').addEventListener('click', function () {
      const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
      const link = document.createElement('a');
      link.download = 'casino-promo.png';
      link.href = dataURL;
      link.click();
    });
  </script>
</body>
</html>
