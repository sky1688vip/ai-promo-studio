<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Promo Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fabric.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .canvas-container { margin: 0 auto; box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-6 py-3.5 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🎰</span>
      <div>
        <h1 class="text-lg font-bold bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-500 bg-clip-text text-transparent">
          AI Promo Studio
        </h1>
        <p class="text-xs text-slate-400">Casino Content & Video Generator</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full">Free AI Connected</span>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <!-- Sidebar Controls -->
    <aside class="w-full lg:w-96 bg-slate-900 border-r border-slate-800 p-5 flex flex-col gap-5 overflow-y-auto max-h-screen">
      
      <!-- 1. AI Image Generator Panel -->
      <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <span>✨</span> AI ပုံထုတ်လုပ်ရန် (Pollinations AI)
        </h2>
        <textarea id="aiPrompt" rows="2" placeholder="ဥပမာ - Casino lucky roulette wheel with flying gold coins, neon light, 3D render..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400">3D golden casino slot machine with jackpot coins, vibrant neon lights</textarea>
        
        <!-- Preset Promo Prompts -->
        <div class="flex flex-wrap gap-1 mt-2 mb-2">
          <button class="ai-chip text-[10px] bg-slate-800 hover:bg-slate-700 text-amber-300 px-2 py-0.5 rounded border border-slate-700">🎰 စလော့ & ဂျက်ပေါ့</button>
          <button class="ai-chip text-[10px] bg-slate-800 hover:bg-slate-700 text-amber-300 px-2 py-0.5 rounded border border-slate-700">🎡 လှည့်ဘီး (Lucky Wheel)</button>
          <button class="ai-chip text-[10px] bg-slate-800 hover:bg-slate-700 text-amber-300 px-2 py-0.5 rounded border border-slate-700">🎁 လက်ဆောင်သေတ္တာ</button>
        </div>

        <button id="generateAiImgBtn" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-slate-950 font-bold py-2 rounded-lg text-xs transition flex justify-center items-center gap-1.5 shadow-md">
          <span id="btnIcon">🪄</span> <span id="btnText">AI ဖြင့် ပုံအသစ်ထုတ်မည်</span>
        </button>
      </div>

      <!-- 2. Manual Upload & Cut/Paste -->
      <div>
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">မိမိစိတ်ကြိုက်ပုံထည့်ရန်</h2>
        <label class="block w-full cursor-pointer bg-slate-800/80 hover:bg-slate-800 border border-dashed border-slate-600 hover:border-amber-400/60 rounded-xl p-2.5 text-center transition">
          <span class="text-xs text-amber-400 font-medium">+ ပုံရွေးချယ်တင်ပါ (Upload)</span>
          <input type="file" id="imageLoader" accept="image/*" class="hidden">
        </label>
      </div>

      <!-- 3. Text & Casino Promo Presets -->
      <div>
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">စာသားထည့်သွင်းရန်</h2>
        <div class="flex flex-col gap-2">
          <input type="text" id="textInput" placeholder="စာသားရိုက်ထည့်ပါ..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
          
          <div class="flex flex-wrap gap-1.5">
            <button class="preset-chip text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">သွင်းငွေ 100% ဘောနပ်စ်</button>
            <button class="preset-chip text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">ရှမ်းကိုးမီး / စလော့</button>
            <button class="preset-chip text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">VIP အထူးလက်ဆောင်</button>
          </div>

          <button id="addTextBtn" class="mt-1 w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-semibold py-1.5 rounded-lg text-xs border border-slate-700 transition">
            + စာသားထည့်မည်
          </button>
        </div>
      </div>

      <!-- 4. Burmese TTS -->
      <div class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800">
        <h2 class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <span>🔊</span> မြန်မာအသံ စမ်းသပ်ရန်
        </h2>
        <input type="text" id="ttsInput" value="အခုပဲ အကောင့်ဖွင့်ပြီး ဘောနပ်စ်ရယူလိုက်ပါ" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-sky-400">
        <button id="speakBtn" class="mt-2 w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-1.5 rounded-lg text-xs transition flex justify-center items-center gap-1.5">
          <span>▶️</span> အသံဖွင့်နားထောင်မည်
        </button>
      </div>

      <!-- 5. Actions -->
      <div>
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ပြင်ဆင်ချက်များ</h2>
        <div class="grid grid-cols-2 gap-2">
          <button id="deleteBtn" class="bg-rose-950/30 hover:bg-rose-900/50 text-rose-400 border border-rose-900/50 py-2 rounded-lg text-xs transition">
            ရွေးထားတာဖျက်မည်
          </button>
          <button id="clearBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700 py-2 rounded-lg text-xs transition">
            အားလုံးရှင်းမည်
          </button>
        </div>
      </div>

      <!-- Download Button -->
      <div class="mt-auto pt-2 border-t border-slate-800">
        <button id="downloadBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-950/50 flex justify-center items-center gap-2">
          <span>📥</span> ပရိုမိုးရှင်းပုံ ဒေါင်းလုဒ်ဆွဲမည်
        </button>
      </div>
    </aside>

    <!-- Canvas Workspace -->
    <main class="flex-1 bg-slate-950 p-6 flex items-center justify-center overflow-auto">
      <div class="border border-slate-800 rounded-2xl overflow-hidden bg-slate-900 shadow-2xl">
        <canvas id="promoCanvas" width="600" height="600"></canvas>
      </div>
    </main>
  </div>

  <script>
    // Canvas တည်ဆောက်ခြင်း
    const canvas = new fabric.Canvas('promoCanvas', {
      backgroundColor: '#0f172a'
    });

    // စတင်ချိန် အခြေခံ background
    const defaultBg = new fabric.Rect({
      left: 0,
      top: 0,
      width: 600,
      height: 600,
      fill: '#111827',
      selectable: false
    });
    canvas.add(defaultBg);

    // AI Prompts Chips ရွေးချယ်မှု
    document.querySelectorAll('.ai-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        const text = this.innerText;
        if(text.includes('စလော့')) {
          document.getElementById('aiPrompt').value = "3D golden casino slot machine with jackpot coins, neon lighting, luxury 8k render";
        } else if(text.includes('လှည့်ဘီး')) {
          document.getElementById('aiPrompt').value = "3D lucky spin wheel casino game, glowing gold and purple, celebration background";
        } else if(text.includes('လက်ဆောင်သေတ္တာ')) {
          document.getElementById('aiPrompt').value = "Luxury open red gift box with gold coins and diamonds exploding out, casino prize 3D";
        }
      });
    });

    // Pollinations AI စနစ်ဖြင့် ပုံအသစ် တိုက်ရိုက်ထုတ်ယူခြင်း
    document.getElementById('generateAiImgBtn').addEventListener('click', function() {
      const prompt = document.getElementById('aiPrompt').value.trim();
      if (!prompt) return;

      const btn = this;
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      
      btnText.innerText = "AI ပုံဆွဲပေးနေပါသည် (ခေတ္တစောင့်ပါ)...";
      btnIcon.innerText = "⏳";
      btn.disabled = true;

      // Random seed ထည့်ပြီး ပုံအသစ် အမြဲရအောင် ပြုလုပ်ခြင်း
      const seed = Math.floor(Math.random() * 100000);
      const encodedPrompt = encodeURIComponent(prompt);
      const aiImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=600&height=600&seed=${seed}&nologo=true`;

      fabric.Image.fromURL(aiImageUrl, function(img) {
        img.scaleToWidth(450);
        img.set({
          left: (600 - img.getScaledWidth()) / 2,
          top: (600 - img.getScaledHeight()) / 2
        });
        canvas.add(img);
        canvas.setActiveObject(img);
        canvas.renderAll();

        btnText.innerText = "AI ဖြင့် ပုံအသစ်ထုတ်မည်";
        btnIcon.innerText = "🪄";
        btn.disabled = false;
      }, { crossOrigin: 'anonymous' });
    });

    // မိမိစက်ထဲက ပုံ Upload တင်ခြင်း
    document.getElementById('imageLoader').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (f) {
        fabric.Image.fromURL(f.target.result, function (img) {
          img.scaleToWidth(300);
          canvas.add(img);
          canvas.setActiveObject(img);
        });
      };
      reader.readAsDataURL(file);
    });

    // စာသား ထည့်သွင်းခြင်း
    function addTextToCanvas(content) {
      const text = new fabric.IText(content, {
        left: 100,
        top: 250,
        fontFamily: 'sans-serif',
        fill: '#facc15',
        stroke: '#000000',
        strokeWidth: 2,
        fontSize: 34,
        fontWeight: 'bold'
      });
      canvas.add(text);
      canvas.setActiveObject(text);
    }

    document.getElementById('addTextBtn').addEventListener('click', function () {
      const val = document.getElementById('textInput').value.trim() || 'ပရိုမိုးရှင်း အထူးလက်ဆောင်';
      addTextToCanvas(val);
    });

    document.querySelectorAll('.preset-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        document.getElementById('textInput').value = this.innerText;
        addTextToCanvas(this.innerText);
      });
    });

    // မြန်မာအသံစနစ် (TTS)
    document.getElementById('speakBtn').addEventListener('click', function() {
      const text = document.getElementById('ttsInput').value;
      if (!text) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'my-MM';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    });

    // ဖျက်ရန်
    document.getElementById('deleteBtn').addEventListener('click', function () {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject !== defaultBg) {
        canvas.remove(activeObject);
      }
    });

    // ရှင်းရန်
    document.getElementById('clearBtn').addEventListener('click', function () {
      canvas.clear();
      canvas.add(defaultBg);
      canvas.renderAll();
    });

    // ဒေါင်းလုဒ်ဆွဲရန်
    document.getElementById('downloadBtn').addEventListener('click', function () {
      const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
      const link = document.createElement('a');
      link.download = 'casino-promo.png';
      link.href = dataURL;
      link.click();
    });
  </script>
</body>
</html>
