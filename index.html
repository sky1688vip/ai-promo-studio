<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Promo Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fabric.js CDN (Canvas Editor အတွက်) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .canvas-container { margin: 0 auto; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-yellow-500 bg-clip-text text-transparent">
      🎰 AI Promo Studio
    </h1>
    <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">Beta v1.0</span>
  </header>

  <!-- Main Body -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
    
    <!-- Sidebar Controls -->
    <aside class="w-full md:w-80 bg-slate-900/90 border-r border-slate-800 p-5 flex flex-col gap-5 overflow-y-auto">
      <div>
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3">ပုံထည့်သွင်းရန်</h2>
        <label class="block w-full cursor-pointer bg-slate-800 hover:bg-slate-700 border border-dashed border-slate-600 rounded-lg p-4 text-center transition">
          <span class="text-sm text-amber-400 font-medium">+ ပုံရွေးချယ်တင်ပါ</span>
          <input type="file" id="imageLoader" accept="image/*" class="hidden">
        </label>
      </div>

      <div>
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3">စာသားထည့်ရန်</h2>
        <div class="flex flex-col gap-2">
          <input type="text" id="textInput" placeholder="စာသားရိုက်ထည့်ပါ..." class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
          <button id="addTextBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-2 rounded text-sm transition">
            + စာသားထည့်မည်
          </button>
        </div>
      </div>

      <div>
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3">ပြင်ဆင်ချက်များ</h2>
        <div class="grid grid-cols-2 gap-2">
          <button id="deleteBtn" class="bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-800/50 py-2 rounded text-xs transition">
            ရွေးထားတာဖျက်မည်
          </button>
          <button id="clearBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 py-2 rounded text-xs transition">
            အားလုံးရှင်းမည်
          </button>
        </div>
      </div>

      <div class="mt-auto pt-4 border-t border-slate-800">
        <button id="downloadBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-lg text-sm transition shadow-lg shadow-emerald-950">
          📥 ပုံဒေါင်းလုဒ်ဆွဲမည်
        </button>
      </div>
    </aside>

    <!-- Canvas Workspace -->
    <main class="flex-1 bg-slate-950 p-6 flex items-center justify-center overflow-auto">
      <div class="border-2 border-slate-800 rounded-lg overflow-hidden bg-slate-900">
        <canvas id="promoCanvas" width="600" height="600"></canvas>
      </div>
    </main>
  </div>

  <script>
    // Canvas တည်ဆောက်ခြင်း
    const canvas = new fabric.Canvas('promoCanvas', {
      backgroundColor: '#1e293b'
    });

    // ပုံ Upload တင်ခြင်း
    document.getElementById('imageLoader').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (f) {
        fabric.Image.fromURL(f.target.result, function (img) {
          img.scaleToWidth(300);
          canvas.add(img);
          canvas.setActiveObject(img);
        });
      };
      reader.readAsDataURL(file);
    });

    // စာသား ထည့်သွင်းခြင်း
    document.getElementById('addTextBtn').addEventListener('click', function () {
      const val = document.getElementById('textInput').value.trim() || 'ပရိုမိုးရှင်း အထူးလက်ဆောင်';
      const text = new fabric.IText(val, {
        left: 100,
        top: 100,
        fontFamily: 'sans-serif',
        fill: '#fbbf24',
        fontSize: 32,
        fontWeight: 'bold'
      });
      canvas.add(text);
      canvas.setActiveObject(text);
    });

    // ဖျက်ရန်
    document.getElementById('deleteBtn').addEventListener('click', function () {
      const activeObject = canvas.getActiveObject();
      if (activeObject) {
        canvas.remove(activeObject);
      }
    });

    // အားလုံးရှင်းရန်
    document.getElementById('clearBtn').addEventListener('click', function () {
      canvas.clear();
      canvas.backgroundColor = '#1e293b';
      canvas.renderAll();
    });

    // ပုံဒေါင်းလုဒ်ဆွဲရန်
    document.getElementById('downloadBtn').addEventListener('click', function () {
      const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
      const link = document.createElement('a');
      link.download = 'casino-promo.png';
      link.href = dataURL;
      link.click();
    });
  </script>
</body>
</html>
